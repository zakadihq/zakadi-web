# Zakadi repository standard: ci.yml for zakadi-web, an npm workspaces monorepo with
# one package-lock.json at the root. The commands are the ones in lefthook.yml, through
# the root scripts: format (prettier --check .), lint (eslint . and the TypeScript 7
# check of every package), test (Vitest in every package), build and size (the gzip
# budgets of spec 06 6.1.5), and test:integration once a package defines it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle budgets (spec 06 6.1.5)
        run: npm run size
      - run: npm run test:integration --if-present
